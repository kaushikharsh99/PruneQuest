name: Tests & Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.3.0

      - name: Lint with Ruff
        run: |
          ruff check .

  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install minimal dev dependencies (no optional lm-eval)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run core unit tests
        run: |
          pytest tests/unit

  eval-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install evaluation extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Run LM Evaluation Harness integration tests
        run: |
          pytest tests/unit/test_lm_eval.py

  flap-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run FLAP test suite
        run: |
          pytest tests/flap

  sweep-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run JIPO sweep test suite
        run: |
          pytest tests/sweep

  cli-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CLI integration tests
        run: |
          pytest tests/integration/test_cli.py

  studio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies with studio extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,studio]"

      - name: Run Studio test suite
        run: |
          pytest tests/studio

  packaging-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and verify clean installation
        run: |
          python -m pip install --upgrade pip
          pip install wheel build pytest
          python -m build --wheel
          pip install dist/*.whl
          prunequest --help
          flap --help
          python -c "import prunequest; print('PruneQuest version:', prunequest.__version__)"
          pytest tests/integration/test_packaging.py
