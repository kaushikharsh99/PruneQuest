[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prunequest"
version = "0.3.0"
description = "Autonomous, Benchmark-Guided LLM Structural Pruning Framework"
readme = "README.md"
authors = [
    { name = "Harsh Kaushik", email = "harshkaushik11000@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["llm", "pruning", "compression", "transformers", "pytorch", "gsm8k", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.0",
    "datasets>=2.18.0",
    "math-verify>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
]
eval = [
    "lm-eval>=0.4.0",
]

[project.scripts]
prunequest = "prunequest.cli:app"
flap = "prunequest.flap.cli:app"

[project.urls]
Homepage = "https://github.com/kaushikharsh99/PruneQuest"
Repository = "https://github.com/kaushikharsh99/PruneQuest.git"
Issues = "https://github.com/kaushikharsh99/PruneQuest/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_model: marks tests that require real LLM weights and GPU/CPU memory",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
