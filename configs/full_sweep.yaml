# PruneQuest Joint Incremental Pruning Optimizer (JIPO) Full Sweep Configuration
model:
  model_id: "Qwen/Qwen2.5-Math-1.5B-Instruct"
  torch_dtype: "bfloat16"
  device: "cuda:0"
  trust_remote_code: false

calibration:
  dataset_name: "openai/gsm8k"
  dataset_config: "main"
  split: "train"
  seed: 42
  num_samples: 128
  screening_samples: 64
  acceptance_samples: 512
  max_length: 512
  batch_size: 1

flap:
  metric: "wifv"
  standardization: "z_score"
  allocation: "uniform"
  compensation: "none"

pruning:
  initial_flap_ratio: 0.05
  minimum_flap_ratio: 0.002
  maximum_total_flap_ratio: 0.25
  backoff_factor: 0.5
  max_block_removals: 4
  min_remaining_layers: 4
  retention: 0.95
  max_iterations: 10
  time_budget_sec: null
  beam_width: 1
  screening_loss_factor: 2.5
  screening_loss_margin: 0.8

evaluation:
  benchmark: "gsm8k"
  policy: "measured"
  batch_size: null
  max_batch_size: 64
  max_new_tokens: 512
  temperature: 0.0
  do_sample: false
  screening_loss_factor: 2.5
  screening_loss_margin: 1.0

hardware:
  max_vram_gb: 5.5
  clear_cache: true
  cpu_offload_validation: true

output_dir: "runs/full_sweep"
reports_dir: "reports"
